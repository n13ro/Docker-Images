services:
  grafana:
      image: grafana/grafana:latest
      container_name: grafana-dev
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin123
      volumes:
        - grafana-data:/var/lib/grafana
      restart: unless-stopped

volumes:
   grafana-data:
