services:
    redis:
      image: redis:7-alpine
      container_name: redis
      restart: unless-stopped
      volumes:
        - redis-data:/data
      command: [
        "redis-server",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
        "--requirepass", "${REDIS_PASSWORD:-123456}",
        "--port", "6379"
      ]
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      security_opt:
        - no-new-privileges:true
      read_only: true
      tmpfs:
        - /tmp
        - /var/run
      logging:
        driver: json-file
        options:
          max-size: 10m
          max-file: "3"

volumes:
  redis-data:
    driver: local
