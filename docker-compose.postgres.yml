
services:
  db:
    image: postgres:18-alpine
    container_name: postgres-dev
    restart: always
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: DbTest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      # POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  pgdata:
